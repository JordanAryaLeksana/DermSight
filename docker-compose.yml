services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dermsight-web

    env_file:
      - .env

    environment:
      CACHE_TYPE: RedisCache
      CACHE_REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/1

    ports:
      - "8000:8000"

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: dermsight-redis

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5

    restart: unless-stopped


volumes:
  redis_data: