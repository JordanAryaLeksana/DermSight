services:
  web:
    image: ghcr.io/USERNAME_KAMU/dermsight:latest
    container_name: dermsight-web
    restart: unless-stopped

    env_file:
      - .env

    environment:
      CACHE_TYPE: RedisCache
      CACHE_REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/1

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: dermsight-redis
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data: